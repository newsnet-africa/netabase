[package]
name = "netabase_macros"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
derive_more = { version = "2.0.1", features = ["from", "try_into"] }
proc-macro2 = { version = "1.0.101", features = ["nightly"] }
quote = "1.0.40"
syn = { version = "2.0.106", features = ["visit", "visit-mut"] }
