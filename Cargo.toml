[package]
name = "netabase"
version = "0.1.0"
edition = "2024"

[dependencies]
libp2p = { version = "0.56.0", features = ["gossipsub", "identify", "kad", "request-response", "macros", "cbor", "ed25519", "noise", "tcp", "yamux", "dns"] }
netabase_store = {path = "../netabase_store"}
netabase_macros = {path = "../netabase_store/netabase_macros"}
strum = "*"
bitflags = { version = "2.10.0", features = ["serde", "serde_core"] }
serde = { version = "1.0.228", features = ["derive", "serde_derive", "std"] }
serde-big-array = "0.5.1"
redb = "3.1.0"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
derive_more = { version = "2.1.0", features = ["display", "try_into", "from"] }
blake3 = "1.5"

[dev-dependencies]
netabase_store = {path = "../netabase_store"}
criterion = "0.5"
tokio = { version = "1", features = ["full", "test-util"] }

[[bench]]
name = "query_benchmarks"
harness = false