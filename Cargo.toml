
[workspace.dependencies]
anyhow = "1.0.100"
bincode = { version = "2.0", features = ["derive", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
derive_more = { version = "2.0.1", features = ["from", "try_into", "into"] }
libp2p = { version = "0.56.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
sled = "0.34.7"
strum = { version = "0.27.2", features = ["derive", "strum_macros"] }
thiserror = "2.0.17"
tempfile = "3.0"
rand = "0.8"
quickcheck = "1.0"
log = "0.4"
env_logger = "0.10"
uuid = { version = "1.0", features = ["v4"] }
futures = "0.3"
getrandom = { version = "0.3", features = ["wasm_js"] }

[package]
name = "netabase"
version = "0.1.0"
edition = "2024"

[features]
default = ["native"]
libp2p = ["netabase_store/libp2p"]
native = [
    "libp2p",
    "netabase_store/native",
    "libp2p/tcp",
    "libp2p/quic",
    "libp2p/mdns",
    "libp2p/dns",
    "libp2p/noise",
    "libp2p/tls",
    "libp2p/yamux",
    "libp2p/kad",
    "libp2p/identify",
    "libp2p/macros",
    "libp2p/websocket",
    "libp2p/tokio",
    "tokio/full"
]
wasm = [
    "libp2p",
    "netabase_store/wasm",
    "libp2p/wasm-bindgen",
    "libp2p/websocket-websys",
    "libp2p/webrtc-websys",
    "libp2p/webtransport-websys",
    "libp2p/noise",
    "libp2p/yamux",
    "libp2p/kad",
    "libp2p/identify",
    "libp2p/macros",
    "tokio/macros",
    "tokio/rt",
    "tokio/sync",
    "tokio/time",
    "log",
    "web-sys",
    "js-sys",
    "wasm-bindgen",
    "wasm-bindgen-futures",
    "getrandom/wasm_js"
]

# [lib]
# crate-type = ["cdylib"]

[dependencies]
anyhow.workspace = true
derive_more.workspace = true
libp2p.workspace = true
# netabase_store = { git = "https://github.com/newsnet-africa/netabase_store.git", default-features = false }
netabase_store = { path = "../netabase_store" }
once_cell = "1.19"
tempfile = { workspace = true }
thiserror.workspace = true
tokio = { version = "1.47.1", default-features = false }
log = { version = "0.4", optional = true }

# WASM-only dependencies
web-sys = { version = "0.3", features = ["console"], optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
getrandom = { workspace = true }
strum.workspace = true



[dev-dependencies]
# netabase_store = { git = "https://github.com/newsnet-africa/netabase_store.git", features = ["libp2p"] }
netabase_store = { path = "../netabase_store" }
anyhow = { workspace = true }
bincode = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde = { workspace = true }
sled = { workspace = true }
strum = { workspace = true }
tempfile = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }
getrandom = { workspace = true }

[[example]]
name = "simple_mdns_chat"
path = "examples/simple_mdns_chat.rs"
