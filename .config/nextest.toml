# Nextest configuration for netabase
# https://nexte.st/book/configuration.html

[profile.default]
# Use multiple threads for fast tests
test-threads = "num-cpus"

# Reasonable timeout for most tests
slow-timeout = { period = "120s", terminate-after = 3 }

[profile.ci]
# CI-specific settings
test-threads = 1
slow-timeout = { period = "180s", terminate-after = 5 }
retries = 2

# Fail fast on first error in CI
fail-fast = true

[profile.integration]
# Profile specifically for integration tests
test-threads = 1
slow-timeout = { period = "300s" }

# Don't fail fast - we want to see all results
fail-fast = false

[profile.all]
# Profile to run ALL tests including ignored integration tests
# Use with: cargo nextest run --profile all --run-ignored all
test-threads = 1
slow-timeout = { period = "300s", terminate-after = 5 }

# Don't fail fast - we want to see all results
fail-fast = false

[profile.quick]
# Quick profile for fast feedback - skips integration tests
test-threads = "num-cpus"
slow-timeout = { period = "60s", terminate-after = 2 }

[test-groups]
# Group tests by type for better organization
# Tests in the same group run sequentially to avoid port conflicts

integration-p2p = { max-threads = 1 }
integration-dht = { max-threads = 1 }
integration-chat = { max-threads = 1 }
integration-network = { max-threads = 1 }

[[profile.default.overrides]]
# Network topology tests need single-threaded execution
filter = 'test(network_topology_tests::)'
test-group = 'integration-network'
slow-timeout = { period = "180s", terminate-after = 3 }

[[profile.default.overrides]]
# P2P integration tests
filter = 'test(p2p_integration_tests::)'
test-group = 'integration-p2p'
slow-timeout = { period = "180s", terminate-after = 3 }

[[profile.default.overrides]]
# DHT advanced tests
filter = 'test(dht_advanced_tests::)'
test-group = 'integration-dht'
slow-timeout = { period = "180s", terminate-after = 3 }

[[profile.default.overrides]]
# Chat integration tests
filter = 'test(chat_integration_tests::)'
test-group = 'integration-chat'
slow-timeout = { period = "180s", terminate-after = 3 }

[[profile.all.overrides]]
# All integration tests in the 'all' profile
filter = 'test(~integration) | test(~topology)'
test-group = 'integration-network'
slow-timeout = { period = "300s", terminate-after = 5 }
