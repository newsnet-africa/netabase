[package]
name = "ux_test_suite"
version = "0.1.0"
edition = "2021"
description = "Comprehensive user experience test suite for Netabase macro hygiene and dependency auto-export"

[features]
default = ["libp2p"]
libp2p = ["dep:libp2p"]

[dependencies]
# Core netabase dependency - this is the only dependency users should need
netabase_store = { path = "../netabase_store" }
# netabase = { path = ".." }  # Temporarily disabled due to compilation issues

# Dependencies needed for derive macros to work (these come transitively through netabase_store)
serde = { version = "1.0", features = ["derive"] }
bincode = { version = "2.0", features = ["derive", "serde"] }
strum = { version = "0.27.2", features = ["derive", "strum_macros"] }
derive_more = { version = "2.0.1", features = ["from", "try_into", "into"] }
sled = "0.34.7"

# Optional libp2p support
libp2p = { version = "0.56.0", features = ["kad"], optional = true }

# Test utilities
tempfile = "3.0"
tokio = { version = "1.0", features = ["full"] }
log = "0.4"
env_logger = "0.10"
serde_json = "1.0"

[dev-dependencies]
# Additional test utilities for integration tests

[[test]]
name = "hygiene_tests"
path = "tests/hygiene_tests.rs"

[[test]]
name = "convenience_tests"
path = "tests/convenience_tests.rs"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

[[test]]
name = "compilation_tests"
path = "tests/compilation_tests.rs"

[[test]]
name = "real_world_scenarios"
path = "tests/real_world_scenarios.rs"
